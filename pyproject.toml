[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "edgescout"
version = "0.1.0"
description = "Quantitative Football Betting Analysis & Paper-Trading Engine"
readme = "README.md"
